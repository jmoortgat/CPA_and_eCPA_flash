name: ecpa
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pandas
  - pyarrow          # parquet read/write
  - matplotlib
  - coolprop         # reference fluid properties used by multisalt/
  - pytest
  - jupyterlab
  - ipykernel
  - pip
  - pip:
    - colour          # color interpolation used by benchmark_flash.py
    - iapws           # IAPWS-95 reference, used by scripts/benchmark_pure_water_density.py
