[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecpa-flash"
version = "1.0.0"
description = "Phase stability and flash calculations for CO2 + H2O + NaCl with the electrolyte Cubic-Plus-Association (eCPA) equation of state"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Joachim Moortgat", email = "moortgat.1@osu.edu" },
  { name = "Felipe Mourão Coelho" },
  { name = "Abbas Firoozabadi" },
]
keywords = [
  "equation of state", "CPA", "electrolyte", "flash calculation",
  "phase equilibria", "CO2 storage", "geothermal", "reservoir simulation",
]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyarrow>=14",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/jmoortgat/CPA_and_eCPA_flash"
Issues = "https://github.com/jmoortgat/CPA_and_eCPA_flash/issues"

[tool.setuptools]
package-dir = { "" = "code", "ecpa" = "code/ecpa" }
packages = ["ecpa"]
py-modules = ["CPA", "cpa_worker", "co2brine_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
