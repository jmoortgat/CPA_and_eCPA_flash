name: Documentation website

# Renders README.md, docs/*.md, notebooks/*.ipynb and the API reference (quartodoc,
# from the docstrings, sections in site/api.yml) with Quarto (site/build_site.py),
# and deploys the result to GitHub Pages whenever those files or the code change on main.
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'notebooks/**'
      # docstrings feed the API reference
      - 'code/ecpa/**'
      - 'code/CPA.py'
      - 'multisalt/ms_ecpa/**'
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.26
      - name: Install quartodoc
        # quartodoc 0.11 needs griffe below 2.0
        run: python3 -m pip install "quartodoc==0.11.1" "griffe<2" pyyaml
      - name: Build the Quarto sources
        run: python3 site/build_site.py
      - name: Build the API reference from the docstrings
        working-directory: site/_build
        run: PYTHONPATH="$GITHUB_WORKSPACE/code:$GITHUB_WORKSPACE/multisalt" quartodoc build
      - name: Titles of the API pages
        run: python3 site/build_site.py --title-api
      - name: Render
        run: quarto render site/_build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
