name: Documentation website

# Renders README.md and docs/*.md with Quarto (site/build_site.py) and deploys the
# result to GitHub Pages whenever those files change on main.
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.26
      - name: Build the Quarto sources
        run: python3 site/build_site.py
      - name: Render
        run: quarto render site/_build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
